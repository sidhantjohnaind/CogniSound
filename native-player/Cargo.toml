[package]
name = "native-player"
version = "6.0.0"
edition = "2021"

[dependencies]
slint = { version = "1.17", features = ["backend-winit", "renderer-winit-femtovg", "renderer-femtovg"] }
reqwest = { version = "0.11", features = ["json", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
image = "0.24.7"
tokio-tungstenite = "0.20"
futures-util = "0.3"

[build-dependencies]
slint-build = "1.8"
